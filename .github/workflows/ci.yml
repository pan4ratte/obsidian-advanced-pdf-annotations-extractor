name: CI

# Lint, tests and type-check on every push and pull request. The release
# workflow (main.yml) only fires when manifest.json's version changes, so
# without this nothing checks a normal commit.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # package-lock.json has to be generated on Linux. `npm install` on
      # Windows resolves 674 entries instead of 676, dropping top-level
      # @emnapi/core and @emnapi/runtime — optional transitive deps of the
      # native @unrs/resolver binding that eslint-plugin-import loads. `npm ci`
      # then fails with "package.json and package-lock.json are not in sync",
      # and the remedy npm suggests is a trap: re-running `npm install` on
      # Windows silently restores the broken lockfile. Checked before the
      # install so the failure names the fix instead of the symptom.
      - name: Verify lockfile was generated on Linux
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const need = ["node_modules/@emnapi/core", "node_modules/@emnapi/runtime"];
            const missing = need.filter((k) => !(k in lock.packages));
            if (missing.length > 0) {
              console.error("::error title=Lockfile generated on Windows::" + missing.join(", ") + " missing from package-lock.json. Regenerate it on Linux (under WSL: npm install) and commit that file. Running npm install on Windows will NOT fix this.");
              process.exit(1);
            }
            console.log("Lockfile carries the Linux-hoisted native resolver deps.");
          '

      - name: Install dependencies
        run: npm ci

      # This guard exists because of how badly the failure downstream of it
      # reads. `noImplicitAny` is false, so a dependency that does not resolve
      # is not a type error — every import from it silently becomes `any` and
      # the type-checked ESLint rules turn that into ~815 no-unsafe-* warnings
      # spread across eight files, against source that is completely clean.
      # It looks exactly like a code problem and is not one. Fail here instead,
      # with one line that names the actual cause.
      - name: Verify dependencies resolved
        run: |
          node -e '
            const fs = require("fs");
            const needed = ["obsidian", "pdfjs-dist", "handlebars"];
            const missing = needed.filter((m) => !fs.existsSync("node_modules/" + m));
            if (missing.length > 0) {
              console.error("::error title=Dependencies not installed::" + missing.join(", ") + " did not resolve. Type-aware ESLint rules will report hundreds of phantom no-unsafe-* warnings against clean source. Fix the install, do not edit src/.");
              process.exit(1);
            }
            console.log("Resolved: " + needed.join(", "));
          '

      # Runs before lint: an unresolved import is TS2307 here, one clear line,
      # where the linter would only show its consequences.
      - name: Type-check
        run: npx tsc -noEmit -skipLibCheck

      # --max-warnings 0 because this repo keeps lint at 0 errors and 0
      # warnings; without it ESLint exits 0 on warnings and the job passes
      # while the warning count climbs.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
